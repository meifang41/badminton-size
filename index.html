<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽球衣服尺寸登記</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#152219; --muted:#5b6b60; --line:#d6ded4;
  --court:#1d5a41; --court-ink:#ffffff; --shuttle:#e9c64a; --warn:#b4531a; --ok:#1d5a41;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1812; --surface:#16241b; --ink:#e8efe6; --muted:#97a89c; --line:#2a3b2f;
  --court:#5fbf8f; --court-ink:#0c1a12; --warn:#f0a064; --ok:#7fd3a6; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding:24px 16px 48px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header h1{font-size:1.7rem;line-height:1.25;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--muted);text-wrap:pretty}
.hline{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px}
.tag{font-size:1rem;font-weight:700;white-space:nowrap}
.tag.price{color:var(--court);font-family:var(--font-num);font-size:1.5rem}
.tag.due{color:var(--warn)}
.design{margin:0;display:flex;flex-direction:column;gap:8px}
.designbtn{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;cursor:zoom-in;display:block;line-height:0}
.designbtn img{width:100%;height:auto;display:block}
.design figcaption{color:var(--muted);font-size:.85rem;text-align:center}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;width:auto;height:auto;border-radius:8px}
.lightbox span{color:#fff;font-size:.9rem;opacity:.8}
.court{display:flex;align-items:center;gap:14px}
.meter{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--court);transition:width .4s}
.count{font-family:var(--font-num);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:1rem;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.lbl{font-weight:700;font-size:.95rem}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
select,input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;margin:0;min-width:0}
.who input,.sizes input{position:absolute;opacity:0;pointer-events:none}
.who label{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer;background:var(--bg);user-select:none}
.who input:checked+label{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.sizewrap{border:0;padding:0;margin:0;min-width:0}
.sizewrap legend,.who legend{padding:0;margin-bottom:8px}
.sizepick{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:10px;align-items:center}
.shirtbox{min-width:0;max-width:230px;margin-inline:auto;width:100%}
.shirt{display:block;width:100%;height:auto}
.shirt .body{fill:var(--surface);stroke:var(--line);stroke-width:2;stroke-linejoin:round;transition:stroke .25s}
.shirt .rib{fill:none;stroke:var(--line);stroke-width:1.2;transition:stroke .25s}
.shirt.on .body,.shirt.on .rib{stroke:var(--court)}
.shirt .dims{opacity:.45;transition:opacity .25s}
.shirt.on .dims{opacity:1}
.shirt .dim{stroke:var(--court);stroke-width:1.3;fill:none}
.shirt .ah{fill:var(--court)}
.shirt text{font-family:var(--font-body);font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.shirtcap{margin:4px 0 0;text-align:center;color:var(--muted);font-size:.85rem}
.shirtextra{margin:2px 0 0;text-align:center;color:var(--warn);font-size:.85rem;font-weight:700}
.shirtextra:empty{display:none}
.shirtnote{margin:2px 0 0;text-align:center;color:var(--muted);font-size:.75rem}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sizepick .sizes label{min-height:0;aspect-ratio:1/1;font-size:1.2rem;border-radius:7px}
.sizes label{display:flex;align-items:center;justify-content:center;min-height:52px;border:1.5px solid var(--line);border-radius:8px;
  font-family:var(--font-num);font-size:1.5rem;font-weight:700;cursor:pointer;background:var(--bg);user-select:none}
.sizes input:checked+label{background:var(--court);color:var(--court-ink);border-color:var(--court)}
input:focus-visible+label,select:focus-visible,input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}
[hidden]{display:none!important}
.field{display:flex;flex-direction:column;gap:6px}
.guestbox{display:flex;flex-direction:column;gap:14px}
.qty{max-width:140px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:13px 18px;background:var(--court);color:var(--court-ink);cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.5em;font-size:.95rem;margin:0}
.msg.ok{color:var(--ok)} .msg.err{color:var(--warn)}
h2{font-size:1.1rem;margin:0}
.note{margin:0;color:var(--muted);font-size:.9rem}
ul.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.roster li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.roster .n{overflow-wrap:anywhere}
.roster .s{font-family:var(--font-num);font-weight:700;font-size:1.2rem;color:var(--ok);white-space:nowrap}
.roster .s.none{font-family:var(--font-body);font-weight:400;font-size:.9rem;color:var(--warn)}
@media (max-width:420px){ul.roster{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <span class="hline">羽球衣服<small class="tag price">一件 $490</small></span>
      <span class="hline">尺寸登記<small class="tag due">截止日為 2026/11/06</small></span>

  SIZES.forEach(function(s){
    var i=document.createElement("input");i.type="radio";i.name="size";i.id="sz-"+s;i.value=s;
    var l=document.createElement("label");l.htmlFor=i.id;l.textContent=s;
    sizesEl.appendChild(i);sizesEl.appendChild(l);
  });
  var qtyEl=$("qty");
  for(var q=1;q<=QTY_MAX;q++){var o=document.createElement("option");o.value=o.textContent=q;qtyEl.appendChild(o)}

  var who=$("who");
  function type(){return document.querySelector('input[name="type"]:checked').value}
  function selectedSize(){var c=document.querySelector('input[name="size"]:checked');return c?c.value:""}

  function buildSelect(){
    var keep=who.value;
    who.innerHTML="";
    var ph=document.createElement("option");ph.value="";ph.textContent="請選擇你的名字";who.appendChild(ph);
    MEMBERS.forEach(function(n,i){
      var o=document.createElement("option");o.value=String(i);
      var d=members[n];
      o.textContent=n+(d?"　✓ 已填":"");
      who.appendChild(o);
    });
    who.value=keep;
  }

  function applyType(){
    var g=type()==="guest";
    $("memberBox").hidden=g;
    $("guestBox").hidden=!g;
    $("msg").textContent="";$("msg").className="msg";
    refreshButton();
  }
  document.querySelectorAll('input[name="type"]').forEach(function(r){r.addEventListener("change",applyType)});

  who.addEventListener("change",function(){
    var d=members[MEMBERS[+who.value]];
    SIZES.forEach(function(s){$("sz-"+s).checked=!!d&&d.size===s});
    qtyEl.value=d?String(d.qty):"1";
    $("msg").textContent="";$("msg").className="msg";
    refreshButton();
  });
  ["gname","gcontact"].forEach(function(id){$(id).addEventListener("input",refreshButton)});
  sizesEl.addEventListener("change",refreshButton);

  // ---- T恤示意圖：形狀與標示會跟著選到的尺寸變化 ----
  var K=2.3,CX=150,Y0=30,ANG=32*Math.PI/180;
  var cur={c:52,l:65},shown=null,raf=0;
  function P(x,y){return x.toFixed(1)+","+y.toFixed(1)}
  function setA(id,o){var el=$(id);for(var k in o)el.setAttribute(k,o[k].toFixed?o[k].toFixed(1):o[k])}
  function draw(v){
    var half=v.c*K/2,len=v.l*K,sl=v.c*0.36*K,ad=56,cw=40; // 袖長僅供繪圖，不標示
    var dx=-Math.cos(ANG),dy=Math.sin(ANG),nx=Math.sin(ANG),ny=Math.cos(ANG);
    var SLx=CX-half+3,SLy=Y0+10;
    var Ex=SLx+sl*dx,Ey=SLy+sl*dy,E2x=Ex+cw*nx,E2y=Ey+cw*ny;
    var Ax=CX-half,Ay=Y0+ad,Hy=Y0+len;
    function m(x){return 2*CX-x}
    $("sh-body").setAttribute("d",
      "M"+P(CX-18,Y0)+" L"+P(SLx,SLy)+" L"+P(Ex,Ey)+" L"+P(E2x,E2y)+" L"+P(Ax,Ay)+
      " L"+P(Ax,Hy)+" L"+P(m(Ax),Hy)+" L"+P(m(Ax),Ay)+" L"+P(m(E2x),E2y)+" L"+P(m(Ex),Ey)+
      " L"+P(m(SLx),SLy)+" L"+P(CX+18,Y0)+" Q"+P(CX,Y0+18)+" "+P(CX-18,Y0)+"Z");
    $("sh-rib").setAttribute("d",
      "M"+P(CX-15,Y0+1)+" Q"+P(CX,Y0+13)+" "+P(CX+15,Y0+1)+
      " M"+P(Ax,Hy-8)+" L"+P(m(Ax),Hy-8));
    // 胸寬
    var yc=Ay+8;
    setA("d-chest",{x1:Ax+1.5,y1:yc,x2:m(Ax)-1.5,y2:yc});
    setA("t-chest",{x:CX-half*0.22,y:yc-7});
    // 衣長
    var xl=CX+half*0.55,y1=Y0+10*(xl-CX-18)/(m(SLx)-CX-18)+1;
    setA("d-len",{x1:xl,y1:y1,x2:xl,y2:Hy-1});
    var ty=(y1+Hy)/2+16,tx=xl+13;
    setA("t-len",{x:tx,y:ty,transform:"rotate(-90 "+tx.toFixed(1)+" "+ty.toFixed(1)+")"});
  }
  function updateShirt(sel){
    var key=CHART[sel]?sel:"";
    if(key===shown)return;
    shown=key;
    var v=CHART[key||"M"];
    $("shirt").classList.toggle("on",!!key);
    $("t-chest").textContent="衣寬 "+(key?v.c:"—");
    $("t-len").textContent="衣長 "+(key?v.l:"—");
    $("shirtcap").textContent=key?key+" 號（單位：公分）":"點右邊的尺寸，看實際尺寸";
    $("shirtextra").textContent=EXTRA[key]?key+" "+EXTRA[key]:"";
    cancelAnimationFrame(raf);
    var from={c:cur.c,l:cur.l},t0=null,dur=260;
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){cur={c:v.c,l:v.l};draw(cur);return}
    (function step(t){
      if(t0===null)t0=t;
      var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      cur={c:from.c+(v.c-from.c)*e,l:from.l+(v.l-from.l)*e};
      draw(cur);
      if(p<1)raf=requestAnimationFrame(step);
    })(performance.now());
  }

  function refreshButton(){
    updateShirt(selectedSize());
    var b=$("submit"),ok;
    if(type()==="member"){
      ok=who.value!=="";
      b.textContent=(ok&&members[MEMBERS[+who.value]])?"更新尺寸":"送出";
    }else{
      ok=$("gname").value.trim()!==""&&$("gcontact").value.trim()!=="";
      b.textContent="送出";
    }
    b.disabled=!ready||busy||!ok||selectedSize()==="";
  }

  function render(){
    var done=0;
    MEMBERS.forEach(function(n){if(members[n])done++});
    $("done").textContent=done;
    $("meter").style.width=(MEMBERS.length?done/MEMBERS.length*100:0)+"%";
    buildSelect();refreshButton();
  }

  function call(params){
    var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
    return fetch(API_URL+"?"+qs).then(function(r){return r.json()});
  }
  function load(){
    return call({action:"list"}).then(function(res){
      var next={};
      (res.members||[]).forEach(function(r){next[r.name]={size:r.size,qty:r.qty||1}});
      members=next;
      ready=true;render();
    });
  }

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    if(!ready||busy)return;
    var size=selectedSize(),qty=qtyEl.value,params,who_;
    if(!size)return;
    if(type()==="member"){
      if(who.value==="")return;
      who_=MEMBERS[+who.value];
      params={action:"submit",type:"member",name:who_,size:size,qty:qty};
    }else{
      who_=$("gname").value.trim();
      var c=$("gcontact").value.trim();
      if(!who_||!c)return;
      params={action:"submit",type:"guest",name:who_,contact:c,size:size,qty:qty};
    }
    busy=true;refreshButton();
    var msg=$("msg");msg.className="msg";msg.textContent="送出中…";
    call(params).then(function(res){
      if(!res.ok)throw new Error(res.error||"failed");
      msg.className="msg ok";msg.textContent=who_+" 的 "+size+" × "+qty+" 已記錄。";
      return load();
    }).catch(function(err){
      msg.className="msg err";
      msg.textContent=(err&&err.message==="full")?"非會員登記名額已滿，請聯絡主辦人。":"送出失敗，請確認欄位後再試一次。";
    }).then(function(){busy=false;refreshButton()});
  });

  render();
  if(!API_URL){
    $("msg").className="msg err";
    $("msg").textContent="尚未設定資料連結。請主辦人把 Google Apps Script 網址貼到 index.html 的 API_URL。";
    return;
  }
  $("msg").textContent="讀取名單中…";
  load().then(function(){$("msg").textContent=""}).catch(function(){
    $("msg").className="msg err";$("msg").textContent="目前連不上資料庫，請稍後重新整理。";
  });
})();
</script>
</body>
</html>
